name: AgentRouter Auto Claim

on:
  schedule:
    - cron: '5 22 * * *' # Daily at 22:05 UTC (05:05 WIB)
  workflow_dispatch:

jobs:
  claim:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install and Connect Cloudflare WARP
        run: |
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update -qq && sudo apt-get install -y -qq cloudflare-warp
          warp-cli --accept-tos registration new 2>/dev/null || warp-cli --accept-tos register 2>/dev/null || true
          warp-cli --accept-tos mode warp
          warp-cli --accept-tos connect
          sleep 4
          curl -s https://cloudflare.com/cdn-cgi/trace | grep -E "warp=|ip=" || true

      - name: Setup Node.js (Latest Stable)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Execute Claims
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          ACCESS_CODE: ${{ secrets.ACCESS_CODE }}
        run: npx tsx scripts/runner.ts
